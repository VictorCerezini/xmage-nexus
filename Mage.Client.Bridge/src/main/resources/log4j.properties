# Bridge client log config - console only

log4j.rootLogger=info, console

log4j.logger.com.j256.ormlite=warn

log4j.appender.console=org.apache.log4j.ConsoleAppender
# stock layout: mage-bench's MicrosecondPatternLayout is not in Nexus's engine, and this
# pattern only prints seconds; the LLM seat supervisor parses these console lines
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=[%d{HH:mm:ss}] %-5p %m%n
log4j.appender.console.Threshold=info
