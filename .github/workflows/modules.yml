name: Launcher modules (jre+server+proxy, llm on Windows)

# Builds, per OS, the modules the Nexus Launcher's light installer downloads on
# first run: jre (jlink) + server + proxy, plus the llm component (model seats:
# a bundled Python, the supervisor and the bridge) on Windows only.
#
# The XMage engine no longer lives in this repo: the fork's `nexus` branch is
# checked out next to it (`xmage-fork/`) and the scripts find it through
# NEXUS_FORK_DIR. release.yml reuses this workflow through workflow_call; it can
# also be started by hand (for example after a fork change).
#
# Note: there is no push trigger: every run builds the engine on 3 OSes (~1 h).

on:
  workflow_dispatch:
    inputs:
      fork_ref:
        description: 'XMage fork branch/rev'
        required: false
        default: nexus
        type: string
      xdhs_ref:
        description: 'XDHS fork tag (xenohedron/mage)'
        required: false
        default: 1.5.8-XDHS-r1
        type: string
      xdhs_version:
        description: 'XDHS fork Maven version (without the tag suffix)'
        required: false
        default: '1.5.8'
        type: string
  workflow_call:
    inputs:
      fork_ref:
        description: 'XMage fork branch/rev'
        required: false
        default: nexus
        type: string
      xdhs_ref:
        description: 'XDHS fork tag (xenohedron/mage)'
        required: false
        default: 1.5.8-XDHS-r1
        type: string
      xdhs_version:
        description: 'XDHS fork Maven version (without the tag suffix)'
        required: false
        default: '1.5.8'
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x64
          - os: windows-latest
            tag: win-x64
          - os: macos-latest
            tag: mac-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.fork_ref }}
          path: xmage-fork
          fetch-depth: 1
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Build engine, plugins and proxy (node scripts/build.mjs)
        run: node scripts/build.mjs
      - name: Build the model-seat bridge (Windows)
        if: matrix.tag == 'win-x64'
        run: node scripts/build.mjs bridge
      - name: Setup uv (Windows)
        if: matrix.tag == 'win-x64'
        uses: astral-sh/setup-uv@v6
      - name: Install the Python bundled with model seats (Windows)
        if: matrix.tag == 'win-x64'
        run: uv python install 3.13
      - name: Assemble staging
        run: node scripts/assemble-modules.mjs staging
        env:
          XDHS_PROXY: '1'
      - name: Assemble the llm component (Windows)
        if: matrix.tag == 'win-x64'
        run: node scripts/assemble-llm.mjs staging
      - name: Build stripped JRE (jlink)
        run: |
          MODULES=$(jdeps --ignore-missing-deps --multi-release 17 --print-module-deps \
            --class-path 'staging/server/lib/*' \
            staging/proxy/mage-proxy-*.jar staging/server/classes/*/)
          echo "modules: $MODULES"
          jlink --add-modules "$MODULES" --strip-debug --no-man-pages --no-header-files \
            --compress=2 --output staging/jre
      - name: Sanity check
        run: |
          test -f staging/version.json
          ls staging/proxy/
          test -x staging/jre/bin/java || test -f staging/jre/bin/java.exe
          staging/jre/bin/java -version
          du -sh staging staging/jre
      - name: Smoke server (normal mode) + proxy
        run: |
          SEP=':'
          if [[ "$RUNNER_OS" == 'Windows' ]]; then SEP=';'; fi
          SERVER_CP="classes/Mage${SEP}classes/Mage.Common${SEP}classes/Mage.Sets${SEP}classes/Mage.Server${SEP}classes/Mage.Player.AI${SEP}lib/*"
          PROXY_JAR=(staging/proxy/mage-proxy-*.jar)
          wait_port() {
            for _ in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$1) 2>/dev/null; then return 0; fi
              sleep 5
            done
            return 1
          }
          ROOT="$PWD"
          SMOKE=$(mktemp -d)
          cp -r staging/server "$SMOKE/server"
          perl -pi -e 's/port="17171"/port="17371"/' "$SMOKE/server/config/config.xml"
          mkdir -p "$SMOKE/server/saved" "$SMOKE/server/gamesHistory"
          (cd "$SMOKE/server" && "$ROOT/staging/jre/bin/java" -Dxmage.testMode=false \
            --add-opens=java.base/java.io=ALL-UNNAMED \
            --add-opens=java.base/java.util=ALL-UNNAMED \
            --add-opens=java.base/java.lang=ALL-UNNAMED \
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
            --add-opens=java.base/java.text=ALL-UNNAMED \
            -cp "$SERVER_CP" \
            mage.server.Main > "$SMOKE/server.log" 2>&1 & echo $! > "$SMOKE/server.pid")
          ("$ROOT/staging/jre/bin/java" -cp "$ROOT/${PROXY_JAR}" org.mage.proxy.Main \
            --wsPort 18887 --httpPort 18888 > "$SMOKE/proxy.log" 2>&1 & echo $! > "$SMOKE/proxy.pid")
          wait_port 17371 || (echo '--- server.log'; tail -20 "$SMOKE/server.log"; exit 1)
          wait_port 18888 || (echo '--- proxy.log'; tail -20 "$SMOKE/proxy.log"; exit 1)
          curl -sf --max-time 10 http://127.0.0.1:18888/index.html -o /dev/null
          grep -q 'Started MAGE server' "$SMOKE/server.log"
          if grep -q 'running in test mode' "$SMOKE/server.log"; then echo 'server in test mode, expected normal mode'; exit 1; fi
          echo 'smoke OK: normal-mode server on 17371 + proxy on 18887/18888'
          kill "$(cat "$SMOKE/server.pid")" "$(cat "$SMOKE/proxy.pid")" 2>/dev/null || true
          sleep 3
          kill -9 "$(cat "$SMOKE/server.pid")" "$(cat "$SMOKE/proxy.pid")" 2>/dev/null || true
      - name: Pack component tarballs
        run: |
          export COPYFILE_DISABLE=1
          tar -czf nexus-jre-${{ matrix.tag }}.tar.gz -C staging/jre .
          tar -czf nexus-server-${{ matrix.tag }}.tar.gz -C staging/server .
          tar -czf nexus-proxy-${{ matrix.tag }}.tar.gz -C staging/proxy .
          if [[ -d staging/llm ]]; then tar -czf nexus-llm-${{ matrix.tag }}.tar.gz -C staging/llm .; fi
      - name: Verify component layout
        run: |
          rm -rf /tmp/layout && mkdir -p /tmp/layout/server /tmp/layout/proxy /tmp/layout/jre
          tar -xzf nexus-server-${{ matrix.tag }}.tar.gz -C /tmp/layout/server
          tar -xzf nexus-proxy-${{ matrix.tag }}.tar.gz -C /tmp/layout/proxy
          tar -xzf nexus-jre-${{ matrix.tag }}.tar.gz -C /tmp/layout/jre
          test -f /tmp/layout/server/version.json
          test -d /tmp/layout/server/classes/Mage.Sets
          test -f /tmp/layout/server/config/config.xml
          ls /tmp/layout/proxy/mage-proxy-*.jar
          test -x /tmp/layout/jre/bin/java || test -f /tmp/layout/jre/bin/java.exe
          if [[ -f nexus-llm-${{ matrix.tag }}.tar.gz ]]; then
            mkdir -p /tmp/layout/llm
            tar -xzf nexus-llm-${{ matrix.tag }}.tar.gz -C /tmp/layout/llm
            test -f /tmp/layout/llm/llm.json
            test -f /tmp/layout/llm/python/python.exe
            test -f /tmp/layout/llm/llm/seat.py
            test -f /tmp/layout/llm/bridge/mage-client-bridge.jar
          fi
      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: nexus-modules-${{ matrix.tag }}
          path: |
            nexus-jre-${{ matrix.tag }}.tar.gz
            nexus-server-${{ matrix.tag }}.tar.gz
            nexus-proxy-${{ matrix.tag }}.tar.gz
            nexus-llm-${{ matrix.tag }}.tar.gz
          retention-days: 30

  # Second proxy flavor: built against the XDHS fork (mage.xdhs.net).
  # The Java jar is platform independent, so it is built ONCE and published as
  # three identical tarballs (one per manifest target).
  proxy-xdhs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: xenohedron/mage
          ref: ${{ inputs.xdhs_ref }}
          path: xdhs-fork
          fetch-depth: 1
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply nexus patches to the XDHS fork
        run: |
          for p in patches/xdhs/*.patch; do
            echo "applying $p"
            git -C xdhs-fork apply "$GITHUB_WORKSPACE/$p"
          done
      - name: Build XMage artifacts (Mage.Common, Mage, Mage.Sets, deck validators)
        # Mage.Server.Plugins/Mage.Deck.Constructed produces org.mage:mage-deck-constructed,
        # which Mage.Proxy needs from v0.4.5 on for full deck validation.
        run: mvn -q -f xdhs-fork/pom.xml -pl Mage.Common,Mage,Mage.Sets,Mage.Server.Plugins/Mage.Deck.Constructed -am install -DskipTests
      - name: Build XDHS proxy
        run: mvn -q -f Mage.Proxy/pom.xml -Dmage.version=${{ inputs.xdhs_version }} clean package -DskipTests
      - name: Smoke XDHS proxy
        run: |
          JAR="Mage.Proxy/target/mage-proxy-${{ inputs.xdhs_version }}.jar"
          test -f "$JAR"
          java --add-opens=java.base/java.io=ALL-UNNAMED \
               --add-opens=java.base/java.util=ALL-UNNAMED \
               --add-opens=java.base/java.lang=ALL-UNNAMED \
               --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
               --add-opens=java.base/java.text=ALL-UNNAMED \
               -cp "$JAR" org.mage.proxy.Main --wsPort 18897 --httpPort 18898 > /tmp/xdhs-proxy.log 2>&1 &
          PID=$!
          for _ in $(seq 1 24); do
            if curl -sf --max-time 5 http://127.0.0.1:18898/index.html -o /dev/null; then break; fi
            sleep 5
          done
          curl -sf --max-time 5 http://127.0.0.1:18898/index.html -o /dev/null || (tail -30 /tmp/xdhs-proxy.log; exit 1)
          kill "$PID" 2>/dev/null || true
          echo 'smoke OK: the XDHS proxy answers on 18898'
      - name: Pack component tarballs (platform independent jar)
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p staging-xdhs
          cp "Mage.Proxy/target/mage-proxy-${{ inputs.xdhs_version }}.jar" staging-xdhs/
          for t in linux-x64 win-x64 mac-arm64; do
            tar -czf "nexus-proxy-xdhs-$t.tar.gz" -C staging-xdhs .
          done
          ls -la nexus-proxy-xdhs-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-modules-xdhs
          path: nexus-proxy-xdhs-*.tar.gz
          retention-days: 30
