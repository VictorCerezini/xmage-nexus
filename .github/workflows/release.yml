name: Release (Tauri + components)

# Ships the Nexus Launcher on the 3 platforms.
# Started BY HAND with a tag (for example v0.2.1): the tag must match the
# version in launcher/src-tauri/tauri.conf.json, Cargo.toml and web/package.json
# (the check-version job verifies it). The installers are light: the components
# (jre, server, proxy, and llm on Windows) are downloaded on first start from
# this same release (components-manifest.json).
#
# Components are DECOUPLED from the app version: `components_tag` picks the
# release the components come from.
#   - empty or equal to the tag -> modules.yml builds the engine (~1 h) and the
#                                  tarballs are published in this release.
#   - an earlier tag            -> NOTHING is built; that release's tarballs are
#                                  downloaded and the manifest points there, so a
#                                  launcher fix does not force a ~200 MB download.
# `components_tag` is also the manifest's `release` (the launcher checks
# `components/<release>/.installed` so it does not download again).
# Required secret: TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD).
# Unsigned: Windows and Linux install with a warning; macOS needs right click → Open.
# The updater works fully when signed; on an unnotarized mac it is best-effort.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'App release tag (v0.2.1; must match launcher/src-tauri/tauri.conf.json, Cargo.toml and web/package.json)'
        required: true
        type: string
      components_tag:
        description: 'Release tag to reuse the components from; empty = same tag (builds the engine)'
        required: false
        default: ''
        type: string
      notes:
        description: 'Release notes'
        required: false
        default: ''
        type: string
      title:
        description: 'Release title; empty = the tag'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VER="${TAG#v}"
          CONF=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          SHELL_VER=$(node -p "require('fs').readFileSync('launcher/src-tauri/Cargo.toml','utf8').match(/\[package\][\s\S]*?version = \"([^\"]+)\"/)[1]")
          LAUNCHER_VER=$(node -p "require('fs').readFileSync('launcher/Cargo.toml','utf8').match(/\[package\][\s\S]*?version = \"([^\"]+)\"/)[1]")
          WEB_VER=$(node -p "require('./web/package.json').version")
          [ "$VER" = "$CONF" ] || { echo "tag $TAG != tauri.conf.json $CONF"; exit 1; }
          [ "$VER" = "$LAUNCHER_VER" ] || { echo "tag $TAG != launcher/Cargo.toml $LAUNCHER_VER"; exit 1; }
          [ "$VER" = "$WEB_VER" ] || { echo "tag $TAG != web/package.json $WEB_VER"; exit 1; }
          echo "tag $TAG OK (shell $SHELL_VER)"

  modules:
    needs: check-version
    if: ${{ inputs.components_tag == '' || inputs.components_tag == inputs.tag }}
    uses: ./.github/workflows/modules.yml

  manifest:
    needs: [check-version, modules]
    if: ${{ !cancelled() && needs.check-version.result == 'success' && needs.modules.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Resolve components tag
        id: comp
        env:
          COMPONENTS_TAG: ${{ inputs.components_tag }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          COMP="$COMPONENTS_TAG"
          [ -n "$COMP" ] || COMP="$RELEASE_TAG"
          echo "tag=$COMP" >> "$GITHUB_OUTPUT"
          echo "components from $COMP (modules: ${{ needs.modules.result }})"
      - uses: actions/download-artifact@v4
        if: needs.modules.result == 'success'
        with:
          pattern: nexus-modules-*
          merge-multiple: true
          path: artifacts
      - name: Download components from an existing release
        if: needs.modules.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download '${{ steps.comp.outputs.tag }}' \
            -R '${{ github.repository }}' -p 'nexus-*' -D artifacts
      - name: Generate components-manifest.json
        run: |
          node scripts/gen-manifest.mjs --tag '${{ steps.comp.outputs.tag }}' \
            --repo '${{ github.repository }}' --dir artifacts \
            --out components-manifest.json
          cat components-manifest.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: components-manifest.json
          retention-days: 90

  bundle:
    needs: manifest
    if: ${{ !cancelled() && needs.manifest.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x64
            updater_key: linux-x86_64
          - os: windows-latest
            tag: win-x64
            updater_key: windows-x86_64
          - os: macos-latest
            tag: mac-arm64
            updater_key: darwin-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci (web)
        working-directory: web
        run: npm ci
      - name: Build web for Tauri
        working-directory: web
        run: npm run build
        env:
          TAURI_BUILD: '1'
      - name: Install Linux webkit deps
        if: matrix.tag == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri bundles (signed for updater)
        working-directory: launcher/src-tauri
        run: cargo install tauri-cli --version '^2' --locked && cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate updater fragment
        run: |
          node scripts/gen-latest.mjs --tag '${{ inputs.tag }}' \
            --repo '${{ github.repository }}' --target-key '${{ matrix.updater_key }}' \
            --bundle-dir launcher/target/release/bundle \
            --out latest-${{ matrix.updater_key }}.json
      - name: Stage release assets (flat)
        run: |
          mkdir -p dist-assets
          find launcher/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' \
               -o -name '*.exe' -o -name '*.msi' -o -name '*.app.tar.gz' -o -name '*.dmg' \
               -o -name '*.zip' -o -name '*.sig' \) -exec cp {} dist-assets/ \;
          cp latest-${{ matrix.updater_key }}.json dist-assets/
          ls -1 dist-assets
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: nexus-bundle-${{ matrix.tag }}
          path: dist-assets/
          retention-days: 90

  publish:
    needs: [bundle, modules]
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        if: needs.modules.result == 'success'
        with:
          pattern: nexus-modules-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-bundle-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-assets
      - name: Merge latest.json (updater)
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          node -e "
            const fs = require('fs');
            const platforms = {};
            for (const f of fs.readdirSync('release-assets')) {
              if (!f.startsWith('latest-') || !f.endsWith('.json')) continue;
              Object.assign(platforms, JSON.parse(fs.readFileSync('release-assets/' + f, 'utf8')));
              fs.rmSync('release-assets/' + f);
            }
            const keys = Object.keys(platforms).sort();
            if (keys.length !== 3) { console.error('updater fragments: ' + keys.join(',')); process.exit(1); }
            fs.writeFileSync('release-assets/latest.json', JSON.stringify({
              version: process.env.TAG.replace(/^v/, ''),
              notes: process.env.NOTES || '',
              pub_date: new Date().toISOString(),
              platforms,
            }, null, 2) + '\n');
            console.log('latest.json: ' + keys.join(','));
          "
          cat release-assets/latest.json | head -n 12
          ls release-assets/
      - name: Build the release body (download guide + notes)
        env:
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          node scripts/gen-release-body.mjs --assets-dir release-assets --tag "$TAG" --notes "$NOTES" --out release-body.md
      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          head -14 release-body.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "${TITLE:-$TAG}" --notes-file release-body.md || true
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
